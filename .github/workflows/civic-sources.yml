name: Civic public source heartbeat
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6,18 * * *'
permissions:
  contents: write
concurrency:
  group: civic-public-heartbeat
  cancel-in-progress: false
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check registered official sources
        run: node civic/tools/check-sources.mjs
      - name: Publish only source-check metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add civic/source-status.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Civic source-check metadata"
          git push origin HEAD:main
